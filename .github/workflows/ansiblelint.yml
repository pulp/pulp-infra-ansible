---
name: "Ansible lint"

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    env:
      ANSIBLE_FORCE_COLOR: "true"
      DEBIAN_FRONTEND: "noninteractive"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v6"
      - name: "Install uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: "Show environment"
        run: |
          uv run ansible --version
          uv run yamllint --version
          uv run ansible-lint --version
      # checks before external roles
      - name: "Test with yamllint"
        run: |
          uv run yamllint .
      - name: "Install Ansible roles"
        run: |
          uv run ansible-galaxy install -r requirements.yml
      - name: "Run Ansible lint"
        run: |
          uv run ansible-lint -p $(find . -mindepth 2 -name ".galaxy_install_info" -printf "%h " | xargs -n 1 dirname | sed -r 's/\./--exclude=\./g') playbooks
      - name: "Remove secrets"
        run: |
          find . -name '*.vault.*' -delete
      - name: "Check syntax"
        run: |
          find playbooks/ -maxdepth 1 -name '*.yml' | xargs -n 1 uv run ansible-playbook --syntax-check
...
