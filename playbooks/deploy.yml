---

- name: "Deploy base system"
  hosts: all
  roles:
    - base
    - entropy
    - guest_virt_tools
    - selinux
    - openssh
    - admin_ssh_keys
    - unattended_updates
    - role: chrony
      servers_preferred: "{{ ntp_servers | default([]) }}"
  tags: base

- name: "Deploy website www.pulpproject.org"
  hosts: www.pulpproject.org
  vars:
    # old builder's user was called websync_user
    # this bit of deployment remain but is useful since
    # doc_builder_staging_pulp_core user was reused in the "new new" deployment
    # but the user is created properly later.
    # this should allow the deployment to work again.
    # until this is properly reworked
    websync_user: doc_builder_staging_pulp_core
  tasks:
    - name: create web builder's user
      user:
        name: "{{ websync_user }}"
        comment: "Web Builder User"
    - name: "Create vhost for {{ inventory_hostname }}"
      include_role:
        name: httpd
        tasks_from: vhost
      vars:
        # use vhost without 'www.' as main URL
        website_domain: pulpproject.org
        server_aliases:
          - www.pulpproject.org
        document_root: "/var/www/docs.pulpproject.org/staging_pulp_core"
        document_root_group: "{{ websync_user }}"
        use_tls: True
        use_letsencrypt: True
        force_tls: True
        hsts_include_subdomains: True
        hsts_preload: True
    - name: Install redirection to canonical vhost
      template:
        src: "{{ inventory_dir }}/data/web/www_canonical_redirection.conf"
        dest: "{{ _vhost_confdir }}/"
        owner: root
        group: root
        mode: "0644"
      notify: verify config and restart httpd

- name: "Deploy website docs.pulpproject.org"
  hosts: www.pulpproject.org
  vars:
    doc_vhost: docs.pulpproject.org
    doc_components:
      en:
        ssh_key: ""
      pulpcore:
        ssh_key: ""
      staging_pulp_core:
        ssh_key: |
          ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDhCXAPTVB3WhOTCvpjmRow9g+AlAgdr6dXq8ctzPP1I
      pulp_2to3_migration:
        ssh_key: ""
      pulp_ansible:
        ssh_key: ""
      pulp_certguard:
        ssh_key: ""
      pulp_cli:
        ssh_key: ""
      pulp_container:
        ssh_key: ""
      pulp_cookbook:
        ssh_key: ""
      pulp_deb:
        ssh_key: ""
      pulp_file:
        ssh_key: ""
      pulp_gem:
        ssh_key: ""
      pulp_installer:
        ssh_key: ""
      pulp_maven:
        ssh_key: ""
      pulp_npm:
        ssh_key: ""
      pulp_oci_images:
        ssh_key: ""
      pulp_operator:
        ssh_key: ""
      pulp_ostree:
        ssh_key: ""
      pulp_python:
        ssh_key: ""
      pulp_rpm:
        ssh_key: ""

  tasks:
    - name: "Install RSSH"
      package:
        name: rssh
        state: installed

    - name: "Create vhost for {{ doc_vhost }}"
      include_role:
        name: httpd
        tasks_from: vhost
      vars:
        website_domain: "{{ doc_vhost }}"
        document_root: "/var/www/{{ doc_vhost }}"
        use_tls: True
        use_letsencrypt: True
        force_tls: True

    - name: "Install vhost specific configuration"
      template:
        src: "{{ inventory_dir }}/data/web/doc_old_layout_redirection.conf"
        dest: "{{ _vhost_confdir }}/"
        owner: root
        group: "{{ httpd_usergroup }}"
        mode: "0644"
      notify: reload httpd

    - name: "Create doc component"
      include_tasks: www/doc_component.yml
      loop: "{{ q('dict', doc_components) }}"
      loop_control:
        loop_var: component
      vars:
        doc_user: "doc_builder_{{ component.key }}"

  tags: doc

- name: "Deploy redirect for obsolete website blog.pulpproject.org"
  hosts: www.pulpproject.org
  vars:
    old_blog_vhost: blog.pulpproject.org
  tasks:
    - name: "Create vhost for {{ old_blog_vhost }}"
      include_role:
        name: httpd
        tasks_from: vhost
      vars:
        website_domain: "{{ old_blog_vhost }}"
        use_tls: True
        use_letsencrypt: True
        redirect: https://pulpproject.org/

- name: "Deploy redirect for obsolete website staging-docs.pulpproject.org"
  hosts: www.pulpproject.org
  vars:
    website_domain: staging-docs.pulpproject.org
  tasks:
    - name: "Create vhost for {{ website_domain }}"
      include_role:
        name: httpd
        tasks_from: vhost
      vars:
        use_tls: True
        use_letsencrypt: True
        redirect: https://pulpproject.org/
  tags: doc


